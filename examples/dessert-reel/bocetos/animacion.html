<script>
'use strict';
// =====================================================================
// Animación «El huequito del postre» (Example Brand) · sobre la estructura de boceto.html (audio ../voz.wav (not included), subtítulos de ../voz.srt).
// Estructura: mundo 3D compartido + ESCENAS [{desde,hasta,montar(),pose(t)}]
// + capa2D(ctx, escena, t) que dibuja stickers proyectando puntos 3D.
// window.seek(t) es puro: el cuadro depende solo de t.
// =====================================================================
const W = 1080, H = 1920;
window.DURATION = 44.6;

const C = {
  crema:'#F1E6D2', nogal:'#7A5638', vino:'#6E2A35', coral:'#D98C7A', salvia:'#A9B8A0', grafito:'#3A3A3C',
  cromo:'#B9BCC0', dorado:'#C9A45C', betun:'#FBF5EA', cereza:'#A23B45', papel:'#FBF5EA', miel:'#F3C77E'
};

// ---------- utilidades ----------
function prng(seed){ let s = seed>>>0; return ()=>{ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }
const V = (x,y,z)=>new THREE.Vector3(x,y,z);

// ---------- render 3D (canvas WebGL oculto) ----------
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

// =====================================================================
// MUNDO 3D compartido: foyer de matinée, materiales y personajes
// =====================================================================
const mundo = (()=>{
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, W/H, 0.1, 200);

  // Ambiente cálido de foyer para que el cromo refleje crema y miel, no negro
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,16), new THREE.MeshBasicMaterial({color:'#e6d7bf', side:THREE.BackSide})));
  const tragaluz = new THREE.Mesh(new THREE.PlaneGeometry(10,6), new THREE.MeshBasicMaterial({color:'#fff3df'}));
  tragaluz.position.set(-2,9,2); tragaluz.lookAt(0,0,0); envScene.add(tragaluz);
  const pisoEnv = new THREE.Mesh(new THREE.PlaneGeometry(30,30), new THREE.MeshBasicMaterial({color:'#cdbfa6'}));
  pisoEnv.rotation.x = -Math.PI/2; pisoEnv.position.y = -4; envScene.add(pisoEnv);
  const vinoEnv = new THREE.Mesh(new THREE.PlaneGeometry(8,6), new THREE.MeshBasicMaterial({color:'#8a4a52'}));
  vinoEnv.position.set(8,0,0); vinoEnv.lookAt(0,0,0); envScene.add(vinoEnv);
  scene.environment = pmrem.fromScene(envScene, 0.04).texture;

  // Tragaluces altos (~4200 K) + relleno generoso: tarde, nada de penumbra
  const sol = new THREE.DirectionalLight(0xffd3a4, 2.3);
  sol.position.set(-5, 14, 8);
  sol.castShadow = true;
  sol.shadow.mapSize.set(2048,2048);
  const sc = sol.shadow.camera; sc.left=-12; sc.right=12; sc.top=12; sc.bottom=-12; sc.near=0.5; sc.far=50;
  sol.shadow.bias = -0.0004; sol.shadow.normalBias = 0.03; sol.shadow.radius = 7;
  scene.add(sol); scene.add(sol.target);
  const relleno = new THREE.HemisphereLight(0xfff1de, 0xc9b79c, 1.15);
  scene.add(relleno);
  const frente = new THREE.DirectionalLight(0xfff0dc, 0.55); // relleno frontal suave (sin sombra)
  frente.position.set(2, 4, 14); scene.add(frente);

  const std = (color, rough=0.82, metal=0, extra={}) => new THREE.MeshStandardMaterial(Object.assign({color, roughness:rough, metalness:metal, envMapIntensity:0.6}, extra));
  const M = {
    pared: std('#F0E3CC', 0.95),
    crema: std(C.crema, 0.9),
    nogal: std(C.nogal, 0.75),
    nogalClaro: std('#946A47', 0.75),
    vino: std('#4A262C', 0.95),
    vinoClaro: std('#5A2E36', 0.95),
    coral: std(C.coral, 0.88),
    salvia: std(C.salvia, 0.8),
    grafito: std(C.grafito, 0.8),
    cromo: std(C.cromo, 0.4, 0.6, {envMapIntensity:1.0}),
    dorado: std(C.dorado, 0.55, 0.45, {envMapIntensity:0.9}),
    blanco: std('#FAF6EE', 0.85),
    hueso: std('#EFE6D6', 0.75),
    almendra: std('#EAD3B5', 0.75),
    bizcocho: std('#E8C283', 0.9),
    betun: std(C.betun, 0.85),
    cereza: std(C.cereza, 0.7),
    piel: std('#E8BFA1', 0.85),
    guisado: std('#8A5A3A', 0.9),
    zanahoria: std('#D98C5A', 0.85),
    miel: new THREE.MeshBasicMaterial({color:'#F7D08A'}),
    cafe: std('#C9A27A', 0.9),
  };

  // Terrazo crema con motitas (textura de canvas, determinista)
  const terrazoTex = (()=>{
    const c = document.createElement('canvas'); c.width = c.height = 1024;
    const g = c.getContext('2d'); const r = prng(1110);
    g.fillStyle = '#EFE5D3'; g.fillRect(0,0,1024,1024);
    const cols = ['#D98C7A','#A9B8A0','#C9A45C','#9A8F84','#C9BBA3','#ffffff','#6E2A35'];
    for (let i=0;i<1700;i++){
      g.fillStyle = cols[Math.floor(r()*cols.length)]; g.globalAlpha = 0.45 + r()*0.4;
      const x=r()*1024, y=r()*1024, s=1.5+r()*5;
      g.beginPath(); g.ellipse(x,y,s,s*(0.5+r()*0.5),r()*3,0,7); g.fill();
    }
    g.globalAlpha=1;
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(9,9);
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
    return t;
  })();
  M.terrazo = new THREE.MeshStandardMaterial({map:terrazoTex, roughness:0.75, envMapIntensity:0.4});
  const terrazoTex2 = terrazoTex.clone(); terrazoTex2.repeat.set(3,1); terrazoTex2.needsUpdate = true;
  M.terrazoBarra = new THREE.MeshStandardMaterial({map:terrazoTex2, roughness:0.75, envMapIntensity:0.4});

  // ---------- geometrías boleadas ----------
  function rrShape(w,h,r){
    const s = new THREE.Shape(), x=-w/2, y=-h/2;
    s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
    s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
    s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s;
  }
  function rbox(w,h,d,r){
    r = Math.min(r, w/2-0.002, h/2-0.002, d/2-0.002);
    const iw=w-2*r, ih=h-2*r, cr=Math.max(0.0005, Math.min(r*0.9, iw/2-0.0005, ih/2-0.0005));
    const g = new THREE.ExtrudeGeometry(rrShape(iw,ih,cr), {depth:Math.max(d-2*r,0.001), bevelEnabled:true, bevelThickness:r, bevelSize:r, bevelSegments:5, curveSegments:10});
    g.center(); return g;
  }
  function lathe(pts, seg=72){ return new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])), seg); }
  function rcylPts(r,h,b){
    const p=[[0,0],[r-b,0]];
    for(let i=1;i<=6;i++){ const a=-Math.PI/2+i/6*Math.PI/2; p.push([r-b+Math.cos(a)*b, b+Math.sin(a)*b]); }
    for(let i=1;i<=6;i++){ const a=i/6*Math.PI/2; p.push([r-b+Math.cos(a)*b, h-b+Math.sin(a)*b]); }
    p.push([0,h]); return p;
  }
  const rcyl = (r,h,b)=>lathe(rcylPts(r,h,b));
  const caps = (r,l)=>new THREE.CapsuleGeometry(r,l,8,20);
  function mk(geo, mat, cast=true, recv=true){ const m=new THREE.Mesh(geo,mat); m.castShadow=cast; m.receiveShadow=recv; return m; }
  function en(obj,x,y,z){ obj.position.set(x,y,z); return obj; }

  const todos = {};
  function reg(nombre, obj){ todos[nombre]=obj; obj.name=nombre; scene.add(obj); return obj; }

  // Piso y pared del foyer
  const piso = reg('piso', mk(new THREE.PlaneGeometry(80,80), M.terrazo, false, true));
  const pared = reg('pared', (()=>{
    const g = new THREE.Group();
    g.add(mk(new THREE.PlaneGeometry(120,80), M.pared, false, true));
    const zoc = mk(rbox(120,0.9,0.12,0.04), M.nogalClaro, false, true); zoc.position.set(0,0.45,0.06); g.add(zoc);
    const moldura = mk(rbox(120,0.08,0.1,0.03), M.dorado, false, true); moldura.position.set(0,0.94,0.07); g.add(moldura);
    return g;
  })());

  // ---------- PASTEL (rebanada de tres capas) ----------
  function capasPastel(L, w, corte=0, mordida=0, escalon=0){
    const g = new THREE.Group();
    const x0 = -L/2 + corte, wc = w*corte/L;
    const forma = (cc)=>{ const a = -L/2 + cc, b = w*cc/L; const s = new THREE.Shape(); s.moveTo(a,0); s.lineTo(L/2,0); s.quadraticCurveTo(L/2+0.16, w/2, L/2, w); s.lineTo(a, b);
      if (mordida) s.quadraticCurveTo(a+mordida, b*0.5, a, 0); s.closePath(); return s; };
    const capa = (y, h, mat, inset=0, extra=0)=>{
      const geo = new THREE.ExtrudeGeometry(forma(corte+extra), {depth:h, bevelEnabled:true, bevelThickness:0.035, bevelSize:0.035-inset, bevelSegments:4, curveSegments:16});
      const m = mk(geo, mat); m.rotation.x = -Math.PI/2; m.position.y = y; g.add(m); return m;
    };
    // escalon: las capas de arriba ya se comieron más (se ve el «a medias» de frente)
    const hs = 0.36, hc = 0.09; let y = 0;
    capa(y, hs, M.bizcocho, 0.01); y += hs+0.03;
    capa(y, hc, M.betun); y += hc+0.03;
    capa(y, hs, M.bizcocho, 0.01); y += hs+0.03;
    capa(y, hc, M.betun); y += hc+0.03;
    capa(y, hs, M.bizcocho, 0.01, escalon); y += hs+0.03;
    capa(y, 0.16, M.betun, 0, escalon); y += 0.16+0.04;
    // betún sobre la espalda (orilla curva)
    const espalda = mk(new THREE.CylinderGeometry(0.06,0.06,y,16), M.betun); espalda.position.set(L/2+0.09, y/2, -w/2); espalda.scale.set(1,1,w*6); g.add(espalda);
    // rosetón y cereza
    const roseton = mk(new THREE.SphereGeometry(0.17,24,16), M.betun); roseton.scale.set(1,0.75,1); roseton.position.set(L/2-0.28, y+0.06, -w/2); g.add(roseton);
    const cereza = mk(new THREE.SphereGeometry(0.17,28,20), M.cereza); cereza.position.set(L/2-0.28, y+0.27, -w/2); g.add(cereza);
    const tallo = mk(new THREE.CylinderGeometry(0.018,0.018,0.32,8), M.nogal); tallo.position.set(L/2-0.22, y+0.5, -w/2); tallo.rotation.z = -0.35; g.add(tallo);
    cereza.userData.y0 = cereza.position.y; tallo.userData.y0 = tallo.position.y;
    g.userData = {alto:y, cereza, tallo, L, w, x0};
    return g;
  }
  function hacerPastel(){
    const g = new THREE.Group();
    const cuerpo = capasPastel(1.5, 0.75); cuerpo.position.y = 0.32; g.add(cuerpo);
    const piernas = [];
    for (const sx of [-0.25, 0.35]){
      const p = new THREE.Group(); p.position.set(sx, 0.36, -0.2);
      const pi = mk(caps(0.045, 0.26), M.grafito); pi.position.y = -0.17; p.add(pi);
      const zap = mk(rbox(0.22,0.09,0.13,0.04), M.dorado); zap.position.set(0.04,-0.33,0); p.add(zap);
      g.add(p); piernas.push(p);
    }
    g.userData = {cuerpo, piernas};
    return g;
  }
  const pastel = reg('pastel', hacerPastel());
  const pastelito = reg('pastelito', new THREE.Group()); // rebanada en platito, cambia de corte por escena
  const cache = {};
  function ponerPastelito(corte, mordida=0, escalon=0){
    pastelito.clear();
    const k = 'c'+corte+'m'+mordida+'e'+escalon; if (!cache[k]) cache[k] = capasPastel(1.5, 0.75, corte, mordida, escalon);
    pastelito.add(cache[k]); pastelito.userData = cache[k].userData;
  }

  // ---------- CADENERO-CEREBRO ----------
  function cabezaCerebro(){
    const geo = new THREE.SphereGeometry(0.6, 128, 96);
    const p = geo.attributes.position, v = new THREE.Vector3();
    for (let i=0;i<p.count;i++){
      v.fromBufferAttribute(p,i); const n = v.clone().normalize();
      let d = 0.03*Math.sin(11*n.x + 4*Math.sin(6*n.y))*Math.cos(9*n.y + 3*n.z) + 0.018*Math.sin(17*n.z + 5*n.x + 2*n.y);
      const surco = Math.exp(-(n.x*n.x)/0.004) * Math.max(0, Math.min(1, (n.y+0.1)*2.5)) * Math.max(0, Math.min(1,(0.75-n.z)*2));
      d -= 0.09*surco;
      const cara = Math.max(0, n.z-0.55)*1.4; d *= (1-Math.min(1,cara)); // frente lisa para la cara
      v.copy(n).multiplyScalar(0.6*(1+d)); p.setXYZ(i, v.x, v.y, v.z);
    }

    const palma = mk(rbox(0.62, 0.22, 0.6, 0.1), M.piel); palma.position.x = 0.3; g.add(palma);
    const dedos = [];

    for (const k in todos){ const o=todos[k]; o.visible=false; o.position.set(0,0,0); o.rotation.set(0,0,0); o.scale.set(1,1,1); }
    piso.visible = true; piso.rotation.x = -Math.PI/2; pared.visible = true;
    camera.clearViewOffset();
    sol.position.set(-5,14,8); sol.target.position.set(0,0,0); sol.intensity = 2.3; sol.color.set(0xffd3a4);
    relleno.intensity = 1.15; frente.intensity = 0.55;
    renderer.toneMappingExposure = 1.12;
    poseCadenero({}); poseMano(0.2, 0.2); cadenero.userData.bI.visible = true;
    pastel.userData.cuerpo.rotation.set(0,0,0);
    for (const p of pastel.userData.piernas) p.rotation.set(0,0,0);
    for (const p of tacita.userData.piernas) p.rotation.set(0,0,0);
    atril.userData.pal.rotation.set(0,0,0);
    cadenero.userData.cabeza.rotation.set(0,0,0); pastel.userData.cuerpo.position.y = 0.32;

    cortina.userData.lamas.forEach((l,i)=>{ l.position.y = 0.17+i*0.3; }); cortina.userData.pie.position.y = 0.08;
  }
  function ver(...nombres){ for (const n of nombres) todos[n].visible = true; }
  function cam(fov, pos, mira){
    camera.fov = fov; camera.aspect = W/H; camera.position.copy(pos); camera.up.set(0,1,0); camera.lookAt(mira);
    camera.clearViewOffset(); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
  }
  function proj(v){ const p = v.clone().project(camera); return {x:(p.x+1)/2*W, y:(1-p.y)/2*H}; }
  function local(obj, v){ obj.updateMatrixWorld(true); return obj.localToWorld(v.clone()); }
  // px por unidad en un punto local de un objeto (para escalar stickers)
  function escala(obj, v, eje=V(1,0,0)){ const a = proj(local(obj,v)), b = proj(local(obj, v.clone().add(eje))); return Math.hypot(b.x-a.x, b.y-a.y); }

  return {scene, camera, sol, relleno, frente, M, todos, reset, ver, cam, proj, local, escala, poseCadenero, poseMano, ponerCordon, ponerPastelito};

const FUENTE = '"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif';
const LW = 7;
function fuente(px, peso=800){ return `${peso} ${px}px ${FUENTE}`; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function trazo(c, w=LW, col=C.grafito){ c.lineWidth=w; c.strokeStyle=col; c.lineCap='round'; c.lineJoin='round'; c.stroke(); }

// Texto grande: lineas = [[ [texto,color], ... ], ...], desde y=280
function rotulo(c, lineas, y=280, size=100, pastilla=true){
  c.save(); c.font = fuente(size); c.textBaseline='alphabetic'; c.textAlign='left';
  const anchoMax = Math.max(...lineas.map(segs=>segs.reduce((a,s)=>a+c.measureText(s[0]).width,0)));
  if (anchoMax > W-128-60){ size = Math.floor(size*(W-128-60)/anchoMax); c.font = fuente(size); }
  lineas.forEach((segs, i)=>{
    const ancho = segs.reduce((a,s)=>a+c.measureText(s[0]).width,0);
    const x0 = W/2 - ancho/2, yb = y + size*0.86 + i*size*1.12;
    if (pastilla){ c.fillStyle = 'rgba(241,230,210,0.95)'; rr(c, x0-30, yb-size*0.86, ancho+60, size*1.08, 26); c.fill(); }
    let x = x0;
    for (const [t,col] of segs){ c.fillStyle = col||C.grafito; c.fillText(t, x, yb); x += c.measureText(t).width; }
  });
  c.restore();
}
function marca(c, clara=false){
  c.save(); c.font = `italic 600 70px ${FUENTE}`; c.textAlign='center'; c.textBaseline='alphabetic';
  c.fillStyle= clara ? 'rgba(251,245,234,0.88)' : 'rgba(58,58,60,0.62)'; c.fillText('Example Brand', 540, 248); c.restore();
}
function destello(c,x,y,s,col='#FFFFFF',borde=true){
  c.save(); c.translate(x,y); c.scale(s,s); c.beginPath();
  c.moveTo(0,-30); c.quadraticCurveTo(4,-4,30,0); c.quadraticCurveTo(4,4,0,30); c.quadraticCurveTo(-4,4,-30,0); c.quadraticCurveTo(-4,-4,0,-30);
  c.fillStyle=col; c.fill(); if(borde) trazo(c, LW*0.7/s); c.restore();
}
function lineasCineticas(c, x, y, ang, n=3, largo=90, sep=34){
  c.save(); c.translate(x,y); c.rotate(ang);
  for(let i=0;i<n;i++){ const o=(i-(n-1)/2)*sep, l=largo*(i===(n-1)/2||n===2?1:0.7); c.beginPath(); c.moveTo(0,o); c.lineTo(l,o); trazo(c); }
  c.restore();
}
function rayitas(c, x, y, r, angs, largo=40, w=LW){
  for (const a of angs){ c.beginPath(); c.moveTo(x+Math.cos(a)*r, y+Math.sin(a)*r); c.lineTo(x+Math.cos(a)*(r+largo), y+Math.sin(a)*(r+largo)); trazo(c, w); }
}
function brillo(c, x, y, r, col='rgba(255,236,190,0.75)'){ // halo cálido detrás del protagonista
  const g = c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,col); g.addColorStop(0.55,'rgba(255,232,180,0.32)'); g.addColorStop(1,'rgba(255,232,180,0)');
  c.fillStyle = g; c.fillRect(x-r,y-r,2*r,2*r);
}
function rayosLuz(c, alfa=0.16){ // haces de los tragaluces, desde arriba a la izquierda
  c.save(); c.globalCompositeOperation='screen';
  for (const [x0,w] of [[60,150],[330,110],[560,170],[860,90]]){
    const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,`rgba(255,238,205,${alfa})`); g.addColorStop(1,'rgba(255,238,205,0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(x0,0); c.lineTo(x0+w,0); c.lineTo(x0+w+520,H*0.75); c.lineTo(x0+520,H*0.75); c.closePath(); c.fill();
  }
  c.restore();
}
// --- caras ---
function ojo(c, x, y, r, o={}){
  const [mx,my] = o.mira||[0,0];
  c.save(); c.beginPath(); c.ellipse(x,y,r,r*(o.alto||1.15),0,0,7); c.fillStyle='#FFFDF8'; c.fill(); c.clip();
  c.beginPath(); c.arc(x+mx*r*0.45, y+my*r*0.45, r*0.6, 0, 7); c.fillStyle=C.grafito; c.fill();
  c.beginPath(); c.arc(x+mx*r*0.45-r*0.2, y+my*r*0.45-r*0.22, r*0.2, 0, 7); c.fillStyle='#fff'; c.fill();
  if (o.parpado){ c.fillStyle = o.colParpado||C.coral; c.fillRect(x-r*1.2, y-r*1.4, r*2.4, r*1.4*o.parpado*1.6); c.beginPath(); c.moveTo(x-r*1.2,y-r*1.4+r*2.24*o.parpado); c.lineTo(x+r*1.2,y-r*1.4+r*2.24*o.parpado); trazo(c, r*0.16); }
  c.restore();
  c.beginPath(); c.ellipse(x,y,r,r*(o.alto||1.15),0,0,7); trazo(c, Math.max(4, r*0.16));
}
function ceja(c, x, y, w, ang=0, curva=0.25){
  c.save(); c.translate(x,y); c.rotate(ang); c.beginPath(); c.moveTo(-w/2,0); c.quadraticCurveTo(0,-w*curva,w/2,0); trazo(c, Math.max(6,w*0.16)); c.restore();
}
function boca(c, x, y, w, tipo='sonrisa', ang=0){
  c.save(); c.translate(x,y); c.rotate(ang); const lw = Math.max(5, w*0.11);
  if (tipo==='sonrisa'){ c.beginPath(); c.moveTo(-w/2,0); c.quadraticCurveTo(0,w*0.6,w/2,0); c.closePath(); c.fillStyle='#8E3440'; c.fill(); trazo(c, lw); }
  else if (tipo==='picara'){ c.beginPath(); c.moveTo(-w/2,-w*0.05); c.quadraticCurveTo(0,w*0.42,w/2,-w*0.22); trazo(c, lw); }
  else if (tipo==='o'){ c.beginPath(); c.ellipse(0,0,w*0.24,w*0.32,0,0,7); c.fillStyle='#8E3440'; c.fill(); trazo(c, lw); }
  else if (tipo==='plana'){ c.beginPath(); c.moveTo(-w/2,0); c.quadraticCurveTo(0,-w*0.08,w/2,w*0.06); trazo(c, lw); }
  else if (tipo==='triste'){ c.beginPath(); c.moveTo(-w/2,w*0.12); c.quadraticCurveTo(0,-w*0.25,w/2,w*0.12); trazo(c, lw); }
  c.restore();
}
function lentesCuadrados(c, x, y, s, ang=0){ // lentes oscuros del cadenero (s = ancho de un cristal)
  c.save(); c.translate(x,y); c.rotate(ang);
  for (const sx of [-1,1]){ rr(c, sx*s*0.58 - s/2, -s*0.38, s, s*0.76, s*0.14); c.fillStyle='#232325'; c.fill(); trazo(c, s*0.09);
    c.beginPath(); c.moveTo(sx*s*0.58 - s*0.3, -s*0.2); c.lineTo(sx*s*0.58 - s*0.1, -s*0.2); trazo(c, s*0.07, 'rgba(255,255,255,0.55)'); }
  c.beginPath(); c.moveTo(-s*0.1,-s*0.12); c.lineTo(s*0.1,-s*0.12); trazo(c, s*0.09);
  c.restore();
}
function lentesCatEye(c, x, y, s, ang=0, alfa=0.92){ // cat-eye de la diva (s = ancho de un cristal)
  c.save(); c.translate(x,y); c.rotate(ang);
  for (const sx of [-1,1]){
    c.save(); c.translate(sx*s*0.6,0); c.scale(sx,1);
    c.beginPath(); c.moveTo(-s*0.5,-s*0.12); c.quadraticCurveTo(-s*0.1,-s*0.42,s*0.62,-s*0.5); c.quadraticCurveTo(s*0.55,s*0.38,0,s*0.34); c.quadraticCurveTo(-s*0.52,s*0.3,-s*0.5,-s*0.12); c.closePath();
    c.fillStyle=`rgba(110,42,53,${alfa})`; c.fill(); trazo(c, s*0.1);
    c.beginPath(); c.moveTo(-s*0.2,-s*0.12); c.lineTo(s*0.1,-s*0.2); trazo(c, s*0.07, 'rgba(255,255,255,0.6)');
    destello(c, s*0.6, -s*0.48, s*0.006, C.dorado, false);
    c.restore();
  }
  c.beginPath(); c.moveTo(-s*0.12,-s*0.08); c.quadraticCurveTo(0,-s*0.2,s*0.12,-s*0.08); trazo(c, s*0.1);
  c.restore();
}
function guanteChico(c, x, y, r, ang=0){ // manita enguantada de caricatura (r = radio de la palma)
  c.save(); c.translate(x,y); c.rotate(ang);
  c.beginPath(); c.ellipse(-r*1.1, 0, r*0.45, r*0.55, 0, 0, 7); c.fillStyle=C.grafito; c.fill();
  c.beginPath(); c.ellipse(0,0,r,r*0.9,0,0,7);
  for (const [fx,fy] of [[0.85,-0.55],[1.0,-0.05],[0.85,0.45]]){ c.moveTo(fx*r+r*0.32, fy*r); c.ellipse(fx*r, fy*r, r*0.34, r*0.26, 0, 0, 7); }
  c.fillStyle='#FAF6EE'; c.fill(); trazo(c, Math.max(5, r*0.16));
  c.restore();
}
function guanteDiva(c, x, y, r, ang=0){ // guante blanco con contorno vino + grafito
  c.save(); c.translate(x,y); c.rotate(ang);
  const forma = ()=>{ c.beginPath(); c.ellipse(0,0,r,r*0.9,0,0,7);
    for (const [fx,fy] of [[0.85,-0.55],[1.0,-0.05],[0.85,0.45]]){ c.moveTo(fx*r+r*0.32, fy*r); c.ellipse(fx*r, fy*r, r*0.34, r*0.26, 0, 0, 7); } };
  forma(); trazo(c, r*0.55, 'rgba(110,42,53,0.95)');
  c.beginPath(); rr(c, -r*1.55, -r*0.55, r*0.6, r*1.1, r*0.2); c.fillStyle=C.grafito; c.fill(); trazo(c, r*0.3, 'rgba(110,42,53,0.95)');
  forma(); c.fillStyle='#FFFFFF'; c.fill(); trazo(c, Math.max(6, r*0.2));
  c.beginPath(); c.moveTo(-r*0.2,-r*0.35); c.lineTo(r*0.35,-r*0.35); c.moveTo(-r*0.2,r*0.05); c.lineTo(r*0.4,r*0.05); trazo(c, Math.max(3,r*0.08), '#9A948A');
  c.restore();
}
function rrp(c,x,y,w,h,r){ c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); } // sin beginPath
function palmaAlto(c, x, y, r, ang=0){ // guante de frente, palma abierta: «¡alto!»
  c.save(); c.translate(x,y); c.rotate(ang);
  const forma = ()=>{ c.beginPath(); rrp(c, -r*0.85, -r*0.7, r*1.7, r*1.55, r*0.6);
    for (const [fx,l] of [[-0.62,1.05],[-0.2,1.25],[0.22,1.2],[0.62,0.95]]){ rrp(c, fx*r-r*0.2, -r*0.7-l*r+r*0.2, r*0.4, l*r+r*0.2, r*0.2); }
    c.save(); c.translate(-r*0.75, r*0.05); c.rotate(-0.75); rrp(c, -r*0.2, -r*0.85, r*0.4, r*0.95, r*0.2); c.restore(); };
  forma(); trazo(c, Math.max(10, r*0.28)); forma(); c.fillStyle='#FFFFFF'; c.fill();
  rr(c, -r*0.75, r*0.8, r*1.5, r*0.35, r*0.12); c.fillStyle='#FAF6EE'; c.fill(); trazo(c, Math.max(5,r*0.12));
  c.beginPath(); c.moveTo(-r*0.3, r*0.15); c.quadraticCurveTo(0, r*0.4, r*0.35, r*0.1); trazo(c, Math.max(3,r*0.07), '#B8B2A8');
  c.restore();
}
function estrella(c, x, y, r, col=C.dorado, borde=true){
  c.beginPath(); for (let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr2 = i%2? r*0.45 : r; c.lineTo(x+Math.cos(a)*rr2, y+Math.sin(a)*rr2); } c.closePath();
  c.fillStyle=col; c.fill(); if (borde) trazo(c, Math.max(4, r*0.14));
}
function guino(c, x, y, r){ c.beginPath(); c.moveTo(x-r,y); c.quadraticCurveTo(x,y+r*0.75,x+r,y); trazo(c, Math.max(6,r*0.22)); }
function rubor(c, x, y, w, h, alfa=0.7){ c.save(); c.globalAlpha=alfa; c.beginPath(); c.ellipse(x,y,w,h,0,0,7); c.fillStyle='#E39C8C'; c.fill(); c.restore(); }
function globo(c, x, y, w, h, colaX, colaY){ // globito crema con cola
  rr(c, x-w/2, y-h/2, w, h, h*0.4);
  c.moveTo(x - w*0.12, y+h/2-2); c.lineTo(colaX, colaY); c.lineTo(x + w*0.08, y+h/2-2);
  c.fillStyle = C.papel; c.fill(); trazo(c, LW);
  rr(c, x-w/2+LW/2, y-h/2+LW/2, w-LW, h-LW, h*0.4); c.fillStyle=C.papel; c.fill();
}
function palomita(c, x, y, r, col=C.salvia){
  c.beginPath(); c.arc(x,y,r,0,7); c.fillStyle=col; c.fill(); trazo(c, Math.max(5,r*0.14));
  c.beginPath(); c.moveTo(x-r*0.45,y+r*0.02); c.lineTo(x-r*0.1,y+r*0.36); c.lineTo(x+r*0.5,y-r*0.35); trazo(c, r*0.2, '#FFFDF8');
}
function etiquetita(c, x, y, txt, ang=0, size=40, fondo=C.papel){
  c.save(); c.translate(x,y); c.rotate(ang); c.font = fuente(size);
  const w = c.measureText(txt).width + 70, h = size*1.55;
  c.beginPath(); c.moveTo(-w/2+26,-h/2); c.lineTo(w/2,-h/2); c.lineTo(w/2,h/2); c.lineTo(-w/2+26,h/2); c.lineTo(-w/2,0); c.closePath();
  c.fillStyle=fondo; c.fill(); trazo(c, 5);
  c.beginPath(); c.arc(-w/2+24,0,7,0,7); trazo(c,4);
  c.fillStyle=C.grafito; c.textAlign='center'; c.textBaseline='middle'; c.fillText(txt, 14, 3);
  c.restore();
}
function moño(c, x, y, s, col=C.grafito){
  c.save(); c.translate(x,y);
  c.beginPath(); c.moveTo(0,0); c.lineTo(-s,-s*0.5); c.lineTo(-s,s*0.5); c.closePath(); c.moveTo(0,0); c.lineTo(s,-s*0.5); c.lineTo(s,s*0.5); c.closePath();
  c.fillStyle=col; c.fill(); trazo(c, Math.max(4,s*0.15), '#1f1f21');
  c.beginPath(); c.arc(0,0,s*0.22,0,7); c.fillStyle=col; c.fill(); trazo(c, Math.max(4,s*0.12), '#1f1f21');
  c.restore();
}
// Cara del cadenero: f = {x,y,s}; o = {lentes, cejas, alza, alzaI, alzaD, reflejo (escala), estrellas (escala), guino (0..1), rubor (alfa)}
function caraCadenero(c, f, o={}){
  const s = f.s, x = f.x, y = f.y, dx = (o.dx||0)*s;
  if (o.estrellas!=null){
    const k = o.estrellas;
    if (k > 0.02) for (const sx of [-1,1]){ const ex = x+sx*s*0.22, ey = y-s*0.05, r = s*0.17*k;
      if (k > 0.9){ c.save(); c.globalCompositeOperation='screen'; const g = c.createRadialGradient(ex,ey,0,ex,ey,r*1.9); g.addColorStop(0,'rgba(255,228,150,0.75)'); g.addColorStop(1,'rgba(255,228,150,0)'); c.fillStyle=g; c.fillRect(ex-r*2,ey-r*2,r*4,r*4); c.restore(); }
      estrella(c, ex, ey, r, '#E2B85A'); destello(c, ex-r*0.25, ey-r*0.3, r*0.006, '#FFFDF8', false); }
    ceja(c, x-s*0.22, y-s*0.3-(o.alza||0)*s, s*0.2, -0.15); ceja(c, x+s*0.22, y-s*0.3-(o.alza||0)*s, s*0.2, 0.15);
  } else if (o.guino!=null){
    const g = o.guino;
    lentesCuadrados(c, x, y-s*lerp(0.07,0.5,g), s*lerp(0.3,0.26,g), -0.08*g);
    if (g > 0.45){
      ojo(c, x-s*0.2, y-s*0.1, s*0.1, {mira:[0,0]}); guino(c, x+s*0.22, y-s*0.1, s*0.11);
      ceja(c, x-s*0.2, y-s*0.31, s*0.18, -0.25); ceja(c, x+s*0.22, y-s*0.27, s*0.18, 0.15, 0.05);
    }
  } else {
    lentesCuadrados(c, x+dx, y-s*0.07, s*0.3, o.ang||0);
    if (o.reflejo){ const k=o.reflejo; destello(c, x+dx+s*0.1, y-s*0.12, s*0.0028*k, C.dorado, false); destello(c, x+dx-s*0.24, y-s*0.13, s*0.0018*k, '#FFF3D6', false); }
    if (o.cejas){ const a=o.alza||0;
      ceja(c, x-s*0.2+dx, y-s*0.36-(a+(o.alzaI||0))*s, s*0.2, -0.2+(o.cI||0));
      ceja(c, x+s*0.2+dx, y-s*0.38-(a+(o.alzaD||0))*s, s*0.2, 0.25+(o.cD||0)); }
  }
  boca(c, x+(o.dxb||0)*s, y+s*(o.by||0.24), s*(o.bw||0.22), o.boca||'plana', o.bang||0);
  if (!o.sinMono){ const a = T.cadenero.userData.arriba, m = proj(local(a, V(0,1.36,0.42))); moño(c, m.x, m.y, s*0.13); }
  if (o.rubor){ c.save(); c.globalAlpha = Math.min(1,o.rubor); rubor(c, x-s*0.36, y+s*0.12, s*0.08, s*0.045); rubor(c, x+s*0.36, y+s*0.12, s*0.08, s*0.045); c.restore(); }
}
function nota(c, x, y, s, ang=0){ // notita musical (silbidito)
  c.save(); c.translate(x,y); c.rotate(ang); c.scale(s,s);
  c.beginPath(); c.ellipse(0,0,14,10,-0.4,0,7); c.fillStyle=C.grafito; c.fill();
  c.beginPath(); c.moveTo(12,-4); c.lineTo(12,-52); c.quadraticCurveTo(30,-40,30,-22); trazo(c, 6/s);
  c.restore();
}

const {ver, cam, proj, local, escala, todos:T, M} = mundo;
const P = (obj,x,y,z)=>proj(local(obj, V(x,y,z)));
function fCad(){ const cb = T.cadenero.userData.cabeza; const p = P(cb, 0, -0.02, 0.6); return {x:p.x, y:p.y, s:escala(cb, V(0,-0.02,0.6))}; }
function fPastel(cuerpo, x=-0.1, y=1.02){ const p = P(cuerpo, x, y, 0.04); return {x:p.x, y:p.y, s:escala(cuerpo, V(x,y,0.04))}; }

// =====================================================================
// ANIMACIÓN: tiempo → pose. Todo depende solo de t (sin estado acumulado).
// =====================================================================
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const lerpV=(a,b,k)=>V(lerp(a.x,b.x,k),lerp(a.y,b.y,k),lerp(a.z,b.z,k));
const eOut=x=>1-Math.pow(1-x,3);
const eIn=x=>x*x;
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=(x,s=1.7)=>{ if(x<=0)return 0; if(x>=1)return 1; const c3=s+1; return 1+c3*Math.pow(x-1,3)+s*Math.pow(x-1,2); };
const pop=(t,t0,d=0.32,s=1.9)=>eBack(prog(t,t0,t0+d),s);          // 0→1 con rebote corto
const caer=x=>x<=0?0:x>=1?1:(x<0.62? Math.pow(x/0.62,2) : 1-0.1*Math.sin(Math.PI*(x-0.62)/0.38)); // cae y rebota una vez
const bulto=(t,a,b)=>{ const k=prog(t,a,b); return Math.sin(Math.PI*k); };   // 0→1→0
const resp=(t,f=0.35,fase=0)=>Math.sin((t*f+fase)*Math.PI*2);            // respiración leve
const parp=(t,t0,base=0)=>base+(1.15-base)*bulto(t,t0,t0+0.2);           // parpadeo
function conEscala(c,s,cx,cy,fn){ if(s<=0.001) return; c.save(); c.translate(cx,cy); c.scale(s,s); c.translate(-cx,-cy); fn(); c.restore(); }
function rotuloPop(c, lineas, t, t0, size=100){ const s = pop(t,t0,0.3,1.9); conEscala(c, s, W/2, 280+size*0.56*lineas.length, ()=>rotulo(c, lineas, 280, size)); }
const ojoP = (c,x,y,r,o)=>ojo(c,x,y,r,Object.assign({colParpado:'#E8C283'},o));

{ nombre:'c3 milagro', desde:6.8, hasta:11.5, encima:['pastelito','mano','tenedor'], contorno:['pastelito','mano','tenedor','campana'],
  montar(t){
    ver('barra','platoPostre','pastelito','campana','telonFondo');
    T.pared.position.set(0,0,-5); T.telonFondo.position.set(0,0,-3.2);
    T.barra.position.set(0,1.8,0);
    T.platoPostre.position.set(-0.35,1.8,0.3);
    mundo.ponerPastelito(0); T.pastelito.position.set(-0.35,1.9,0.55); T.pastelito.rotation.y = 0.5;
    T.pastelito.visible = t >= 7.0;
    // campana: tapa el pastel y sube (7.0–7.8)
    const cl = prog(t,7.0,7.8), cb = eBack(cl,1.2), ce = eOut(cl);
    T.campana.position.copy(lerpV(V(-0.35,1.83,0.3), V(-1.75,3.55,-0.4), cb));
    T.campana.position.y += 1.2*bulto(t,7.0,7.8); // primero sube, luego se va de lado
    T.campana.rotation.set(lerp(0,0.3,ce),0,lerp(0,0.8,ce)); T.campana.scale.setScalar(lerp(1.4,0.72,ce));
    // mano: pose final (puño sobre el tenedor)
    const dx = V(-0.78,0.62,0).normalize(), dy = V(0,0.2,1).normalize(), dz = dx.clone().cross(dy).normalize(); dy.crossVectors(dz, dx);
    T.mano.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(dx,dy,dz)); T.mano.scale.setScalar(0.85);
    T.mano.position.set(1.2,3.1,0.9);
    T.mano.updateMatrixWorld(true); const agarre = T.mano.localToWorld(V(0.74,-0.14,0));
    T.tenedor.scale.setScalar(0.85); T.tenedor.quaternion.setFromUnitVectors(V(0,1,0), dz.clone().add(V(-0.1,0,0)).normalize());
    T.tenedor.updateMatrixWorld(true); T.tenedor.position.add(agarre.clone().sub(T.tenedor.localToWorld(V(0,0.42,0))));
    // «mágicamente» (~8.8): la mano revive y atrapa el tenedor que cae
    const a = eOut(prog(t,8.55,8.95));
    const tink = bulto(t,10.3,10.5) + bulto(t,10.8,11.0);
    const listo = eIO(prog(t,9.35,10.2)), rebote = bulto(t,8.95,9.25);
    const golpe = V(-0.55,-0.95,-0.35).multiplyScalar(listo).add(V(-0.05,-0.12,0).multiplyScalar(rebote)).add(V(0,0.28,0).multiplyScalar(listo*(1-tink)-listo));
    const off = V(1.3,-1.6,0.4).multiplyScalar(1-a).add(golpe);
    T.mano.position.add(off); T.mano.visible = t >= 8.55;
    const cl2 = eOut(prog(t,8.86,9.0));
    mundo.poseMano(lerp(0.2,1.45,cl2), lerp(0.1,1.35,cl2), 0.1*(1-cl2), [lerp(0.4,0.9,cl2), lerp(0.2,0.7,cl2)]);
    const fall = eIn(prog(t,8.5,8.92));
    T.tenedor.position.add(V(0.35*(1-fall), 3.4*(1-fall), 0)).add(golpe);
    T.tenedor.rotateOnWorldAxis(V(0,0,1), 2.2*(1-fall));
    T.tenedor.visible = t >= 8.5;
    cam(30, V(0,6.2,13.5), V(0,2.75,0));
  },
  pose(t){},
  dibujar(c,t,pase){
    const cu = T.pastelito;
    if (pase==='fondo'){ rayosLuz(c, 0.12); if (t>=7.0){ const f = fPastel(cu, 0.0, 0.7); brillo(c, f.x, f.y, 560*(0.5+0.5*eOut(prog(t,7.0,7.8))), 'rgba(255,226,170,0.85)'); } return; }
    if (t >= 7.0){
      const f = fPastel(cu, -0.08, 0.98);
      const pa = Math.max(1.1*(1-eOut(prog(t,7.25,7.5))), parp(t,10.4), parp(t,10.9));
      const mira = t < 8.6 ? [-0.6,-0.5] : [0.6,-0.4];
      ojoP(c, f.x-f.s*0.2, f.y, f.s*0.11, {mira, parpado:pa}); ojoP(c, f.x+f.s*0.16, f.y-f.s*0.02, f.s*0.11, {mira, parpado:pa});
      boca(c, f.x-f.s*0.02, f.y+f.s*0.25, f.s*0.22, 'sonrisa');
      const ce = proj(local(cu.userData.cereza, V(0,0,0))), k = pop(t,7.45,0.35,2.2);
      destello(c, ce.x+40, ce.y-46, 1.2*k, '#FFFDF8'); destello(c, f.x-f.s*0.95, f.y-f.s*0.35, 0.8*k*(0.85+0.15*resp(t,0.8)), C.dorado); destello(c, f.x+f.s*1.05, f.y+f.s*0.1, 0.6*k, '#FFFDF8');
    }
    if (t>7.0 && t<8.1){ const cp = P(T.campana, 0, 0.6, 0); c.save(); c.globalAlpha = bulto(t,7.0,8.1); lineasCineticas(c, cp.x+30, cp.y+150, Math.PI*0.62, 3, 80, 36); c.restore(); }
    if (t >= 8.9 && t < 9.5){ const tp = P(T.tenedor, 0, 1.55, 0); c.save(); c.globalAlpha = 1-prog(t,9.25,9.5); rayitas(c, tp.x, tp.y, 70, [-1.9,-1.45,-1.0,-0.55], 34*pop(t,8.9,0.2)); c.restore(); }
    if (t > 8.55 && t < 9.2){ const mp = P(T.mano, 0.3, 0, 0); c.save(); c.globalAlpha = 1-prog(t,8.95,9.2); lineasCineticas(c, mp.x+70, mp.y+70, 0.65, 3, 70, 32); c.restore(); }
    for (const t0 of [10.4, 10.9]) if (t>=t0 && t<t0+0.4){ // tink-tink: arquitos de sonido en el golpe
      const tp = P(T.tenedor, 0, -0.02, 0), k = eOut(prog(t,t0,t0+0.3));
      c.save(); c.globalAlpha = 1-prog(t,t0+0.2,t0+0.4);
      for (const lado of [-1,1]) for (let i=0;i<3;i++){ const r0 = 30+i*26+k*18; c.beginPath(); c.arc(tp.x, tp.y, r0, lado<0?Math.PI*0.8:-Math.PI*0.2, lado<0?Math.PI*1.2:Math.PI*0.2); trazo(c, 6); }
      c.restore(); }

{ nombre:'c10 tacita', desde:39.6, hasta:44.61, encima:['tacita','cadenero'], contorno:['tacita','cadenero'],

// =====================================================================
// SUBTÍTULOS (del SRT embebido, palabra por palabra; banda y 1390–1560)
// =====================================================================
const SUBS = (()=>{
  const txt = document.getElementById('srt').textContent.trim();
  const ts = s=>{ const [h,m,r]=s.split(':'); const [sec,ms]=r.split(','); return +h*3600 + +m*60 + +sec + +ms/1000; };
  const pal = txt.split(/\n\s*\n/).map(b=>{ const l=b.trim().split('\n'); const [a,z]=l[1].split('-->').map(x=>ts(x.trim())); return {a, z, w:l.slice(2).join(' ').trim()}; });
  // frases armadas a mano (palabras por frase, en orden); máximo 2 líneas
  const N = [6,4,2,3,4, 2,5,3, 4,6,4,3,3, 6,5,5, 6,7,4,6, 6,3,4];
  const fr = []; let i = 0; for (const n of N){ fr.push(pal.slice(i, i+n)); i += n; }
  if (i !== pal.length) console.error('SRT: las frases no cuadran con las palabras', i, pal.length);
  return fr.map((ws,i)=>{ const sig = fr[i+1]; const a = ws[0].a, z = ws[ws.length-1].z; return {a, z: sig ? Math.min(sig[0].a, z+0.6) : 99, txt: ws.map(w=>w.w).join(' ')}; });
})();
window.SUBS = SUBS;
function lineasSub(c, txt, max){
  const p = txt.split(' ');
  if (c.measureText(txt).width <= max && p.length<=5) return [txt];
  let mejor=null;
  for (let i=1;i<p.length;i++){ const A=p.slice(0,i).join(' '), B=p.slice(i).join(' '); const m=Math.max(c.measureText(A).width, c.measureText(B).width); if(!mejor||m<mejor[0]) mejor=[m,[A,B]]; }
  return mejor[1];
}
function subtitulo(c, t){
  const s = SUBS.find(x=>t>=x.a && t<x.z); if (!s) return;
  c.save(); c.font = fuente(66); c.textAlign='center'; c.textBaseline='middle';
  const ls = lineasSub(c, s.txt, W-128-60), yc = 1475, paso = 82;
  ls.forEach((l,i)=>{
    const y = yc + (i-(ls.length-1)/2)*paso, w = c.measureText(l).width + 48;
    c.fillStyle='rgba(241,230,210,0.96)'; rr(c, W/2-w/2, y-38, w, 76, 22); c.fill(); trazo(c, 3);
    c.fillStyle=C.grafito; c.fillText(l, W/2, y+3);
  });
  c.restore();
}

// =====================================================================
// capa2D(ctx, escena, t) y seek(t)
// =====================================================================
function capa2D(c, escena, t, pase){ c.save(); escena.dibujar(c, t, pase); c.restore(); c.setTransform(1,0,0,1,0,0); }

const fantasmaMat = new THREE.MeshBasicMaterial({colorWrite:false, depthWrite:false});
function fantasmas(nombres){
  const g=[]; for (const n of nombres) T[n].traverse(o=>{ if (o.isMesh){ g.push([o,o.material]); o.material=fantasmaMat; } });
  return ()=>{ for (const [o,m] of g) o.material=m; };
}
const capaTmp = document.createElement('canvas'); capaTmp.width=W; capaTmp.height=H; const tctx = capaTmp.getContext('2d');
function anillo(src, r, col, n=16){
  tctx.globalCompositeOperation='source-over'; tctx.clearRect(0,0,W,H);
  for (let i=0;i<n;i++){ const a=i/n*Math.PI*2; tctx.drawImage(src, Math.cos(a)*r, Math.sin(a)*r); }
  tctx.globalCompositeOperation='source-in'; tctx.fillStyle=col; tctx.fillRect(0,0,W,H);
  tctx.globalCompositeOperation='source-over';
  ctx.drawImage(capaTmp,0,0);
}
const capaP = document.createElement('canvas'); capaP.width=W; capaP.height=H; const pctx = capaP.getContext('2d');
function pintarSolo(nombres, contorno, vino=false, recorte=null){
  nombres = nombres.filter(n=>T[n].visible);
  if (!nombres.length) return;
  const otros = Object.keys(T).filter(k=>T[k].visible && !nombres.includes(k) && k!=='piso' && k!=='pared');
  const vis = [[T.piso,T.piso.visible],[T.pared,T.pared.visible]]; T.piso.visible=false; T.pared.visible=false;
  const undo = fantasmas(otros);
  renderer.setClearColor(0x000000,0); renderer.render(mundo.scene, mundo.camera);
  undo(); for (const [o,v] of vis) o.visible=v;
  let src = renderer.domElement;
  if (recorte){ pctx.globalCompositeOperation='source-over'; pctx.clearRect(0,0,W,H); pctx.drawImage(src,0,0);
    pctx.globalCompositeOperation='destination-out'; pctx.beginPath(); recorte(pctx); pctx.fill(); pctx.globalCompositeOperation='source-over'; src = capaP; }
  if (vino) anillo(src, 13, 'rgba(110,42,53,0.9)', 24);
  if (contorno) anillo(src, 7, C.grafito);
  ctx.drawImage(src,0,0);
}

const listo = (async ()=>{
  try { await document.fonts.load(`800 100px "Avenir Next"`); await document.fonts.load(`italic 600 70px "Avenir Next"`); } catch(e){}
})();

window.ESCENAS = ESCENAS;
window.seek = async function(t){
  await listo;
  t = Math.max(0, Math.min(window.DURATION, t));
  const esc = ESCENAS.find(e => t >= e.desde && t < e.hasta) || ESCENAS[ESCENAS.length-1];
  mundo.reset(); mundo.relleno.color.set(0xfff1de); T.cucharita.userData.bocado.visible = true;
  esc.montar(t); esc.pose(t);
  const kc = 1.4; // cereza 1.4× en todos
  for (const cu of [T.pastel.userData.cuerpo, T.pastelito]) { const u = cu.userData; if (!u || !u.cereza) continue;
    u.cereza.scale.setScalar(kc); u.cereza.position.y = u.cereza.userData.y0 + 0.17*(kc-1); u.tallo.position.y = u.tallo.userData.y0 + 0.34*(kc-1); }
  mundo.scene.updateMatrixWorld(true);
  const enc = esc.encima || [], cont = esc.contorno || [];
  const capa1 = cont.filter(n=>!enc.includes(n));
  const undo = fantasmas([...enc, ...capa1]);
  renderer.setClearColor(0xF0E3CC, 1); renderer.render(mundo.scene, mundo.camera); undo();
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  ctx.drawImage(renderer.domElement, 0, 0);
  pintarSolo(capa1, true);
  capa2D(ctx, esc, t, 'fondo');
  const pasteles = enc.filter(n=>cont.includes(n) && (n==='pastel'||n==='pastelito'));
  pintarSolo(pasteles, true, true, esc.recorte ? (g)=>esc.recorte(g, t) : null);
  pintarSolo(enc.filter(n=>cont.includes(n) && !pasteles.includes(n)), true);
  pintarSolo(enc.filter(n=>!cont.includes(n)), false);
  capa2D(ctx, esc, t, 'frente');
  marca(ctx, T.telonFondo.visible);
  subtitulo(ctx, t);
};
window.cajas = (nombres)=>{ const o={}; for (const n of nombres){ const b=new THREE.Box3().setFromObject(T[n]); let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const x of [b.min.x,b.max.x]) for (const y of [b.min.y,b.max.y]) for (const z of [b.min.z,b.max.z]){ const p=proj(V(x,y,z)); x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); }
  o[n]=[x0,y0,x1,y1].map(Math.round); } return o; };

// =====================================================================
// REPRODUCTOR (fuera del canvas; con ?render=1 se oculta y no se escala)
// =====================================================================
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');
const voz = document.getElementById('voz'), btn = document.getElementById('play'), barra = document.getElementById('barra'), reloj = document.getElementById('reloj');
function ajustar(){ if (RENDER) return; const e=document.getElementById('escena'); const k=Math.min(e.clientWidth/W, e.clientHeight/H)*0.98; cv.style.width=Math.round(W*k)+'px'; cv.style.height=Math.round(H*k)+'px'; }
addEventListener('resize', ajustar); ajustar();
let ocupado=false, pendiente=null;
async function pintar(t){ if (ocupado){ pendiente=t; return; } ocupado=true; try{ await window.seek(t); } finally { ocupado=false; } if (pendiente!==null){ const p=pendiente; pendiente=null; pintar(p); } }
let silencioso=false, reproduciendo=false, tiempo=0, inicio=0;
function ui(t){ barra.value=t; reloj.textContent=t.toFixed(2)+' / '+window.DURATION.toFixed(2)+' s'; btn.textContent = (silencioso ? !reproduciendo : voz.paused) ? '▶ Reproducir' : '❚❚ Pausa'; }
function bucle(){ const t=silencioso ? Math.min(window.DURATION, tiempo+(performance.now()-inicio)/1000) : voz.currentTime; if (silencioso && t>=window.DURATION){ tiempo=t; reproduciendo=false; } ui(t); pintar(t); if (silencioso ? reproduciendo : !voz.paused && !voz.ended) requestAnimationFrame(bucle); }
btn.onclick = ()=>{ if (silencioso){ if (reproduciendo){ tiempo=Math.min(window.DURATION, tiempo+(performance.now()-inicio)/1000); reproduciendo=false; ui(tiempo); } else { if (tiempo>=window.DURATION-0.05) tiempo=0; inicio=performance.now(); reproduciendo=true; requestAnimationFrame(bucle); } } else if (voz.paused){ if (voz.currentTime >= window.DURATION-0.05) voz.currentTime=0; voz.play().then(()=>requestAnimationFrame(bucle)).catch(()=>{ silencioso=true; tiempo=+barra.value; inicio=performance.now(); reproduciendo=true; requestAnimationFrame(bucle); }); } else { voz.pause(); ui(voz.currentTime); } };
barra.oninput = ()=>{ const t=+barra.value; if (silencioso){ tiempo=t; inicio=performance.now(); } else voz.currentTime=t; ui(t); pintar(t); };
voz.onended = ()=>ui(voz.currentTime);
addEventListener('keydown', e=>{ if (e.code==='Space' && !RENDER){ e.preventDefault(); btn.onclick(); } });
window.seek(0);
